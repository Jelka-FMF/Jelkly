<div class="docs-top-bar @tocclass@" role="banner">
    <div id="top-bar" class="menu-bar" role="menubar">
        @sidebarToggle@
        <div class="logo-group" role="menuitem">
            <img src="/docs/static/orglogowide.png" alt="Fakulteta za matematiko in fiziko Logo" />
            <div class="header-title">
                <a href="https://jelkly.fmf.uni-lj.si/"><img src="/docs/static/icons/favicon-wide.svg" alt="Jelka Logo" /></a>
            </div>
        </div>
    </div>
    <form id="search" class="search" role="search" action="https://www.google.com/search" method="get" target="_blank" rel="noopener">
        <div class="ui fluid action input">
            <input type="hidden" name="as_sitesearch" value="@homeurl@" />
            <input type="search" name="q" placeholder="Išči ..." aria-label="Iskanje" required />
            <button type="submit" class="ui icon button" aria-label="Išči">
                <i class="search icon" aria-hidden="true"></i>
            </button>
        </div>
    </form>
</div>

<div id="side-menu" class="ui vertical accent @tocclass@ sidebar menu left hideprint docs uncover visible" role="menubar">
    <div class="menuContainer" role="menu">@TOC@</div>
</div>

<style>
    .header-title { padding: 0 !important; }
    .header-title img { height: 1.1rem !important; }
    .header-title a { display: flex; align-items: center; }
</style>
